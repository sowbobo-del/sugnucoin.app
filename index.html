      if(el.textContent && el.textContent.includes('0.87M GNF') && el.textContent.includes('500k SUGNU')){
        // This is the pool card or close
        var card = el.closest('div.rounded-\[20px\]') || el.parentElement;
        // Find the track
        var tracks = document.querySelectorAll('div.h-1, div.h-1\.5, div.h-\[6px\]');
        tracks.forEach(function(track){
          if(track.classList.contains('w-full') && track.classList.contains('rounded-full')){
            // Check if it already has orange fill
            var inner = track.querySelector('div.h-full');
            if(!inner){
              // Create inner orange bar 72%
              var fill = document.createElement('div');
              fill.className = 'h-full rounded-full';
              fill.style.width = '72%';
              fill.style.backgroundColor = '#FF7A00';
              fill.style.background = '#FF7A00';
              track.appendChild(fill);
              track.style.backgroundColor = 'rgba(255,255,255,0.08)';
            } else {
              inner.style.width = '72%';
              inner.style.backgroundColor = '#FF7A00';
              inner.style.background = '#FF7A00';
              inner.classList.remove('bg-[#2A97DF]', 'bg-[#FF7900]');
            }
          }
        });
      }
    });
    // Also generic fix for any gray empty bar that should be orange
    document.querySelectorAll('div.w-full.rounded-full').forEach(function(track){
      if(track.offsetHeight <= 8 && track.offsetHeight >= 4){
        // Likely the progress track (6px high)
        var inner = track.querySelector('div');
        if(!inner || inner.offsetWidth === 0){
          if(!inner){
            var fill = document.createElement('div');
            fill.style.width = '72%';
            fill.style.height = '100%';
            fill.style.borderRadius = '9999px';
            fill.style.backgroundColor = '#FF7A00';
            track.appendChild(fill);
          }
        } else {
          inner.style.backgroundColor = '#FF7A00';
          inner.style.width = inner.style.width || '72%';
          if(inner.style.width === '0%' || inner.style.width === ''){
            inner.style.width = '72%';
          }
        }
      }
    });
  }
  // Run after load
  window.addEventListener('load', function(){ setTimeout(fixBars, 1000); setTimeout(fixBars, 3000); });
  // Also run after React updates
  setInterval(fixBars, 2000);
})();
</script>
</body>
</html>
